<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Dashboard - Bootstrap</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background:#e9f2ff;
      color:#111;
      font-family:Arial, sans-serif;
    }

    /* Navbar */
    .navbar{
      background:#004aad !important;
    }

    /* Card */
    .card{
      background:#ffffff;
      border:none;
      border-radius:15px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      color:#111;
    }

    /* Button */
    .btn-custom{
      background:#004aad;
      color:white;
      font-weight:bold;
    }

    .btn-custom:hover{
      background:#00337a;
      color:white;
    }

    /* Modal */
    .modal-content{
      background:#ffffff;
      color:#111;
      border-radius:15px;
    }

    /* Form */
    .form-label{
      color:#111;
      font-weight:600;
    }

    .form-control{
      color:#111;
      background:#f8f9fa;
      border:1px solid #ccc;
    }

    .form-control:focus{
      border-color:#004aad;
      box-shadow:none;
    }

    .invalid-feedback{
      color:red;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark px-3">
  <a class="navbar-brand" href="#">Personal Dashboard</a>

  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="menu">
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="#">About</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
    </ul>
  </div>
</nav>

<!-- Content -->
<div class="container mt-5">

  <!-- Card -->
  <div class="card p-4 text-center">
    <h2>Personal Interactive Dashboard Bootstrap</h2>
    <p>Simple Interactive Bootstrap Activity</p>

    <!-- Button -->
    <button class="btn btn-custom" data-bs-toggle="modal" data-bs-target="#myModal">
      Open Form
    </button>
  </div>

</div>

<!-- Modal -->
<div class="modal fade" id="myModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Contact Form</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <!-- Form -->
        <form class="needs-validation" novalidate>

          <!-- Name -->
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" required>
            <div class="invalid-feedback">
              Please enter your name.
            </div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" required>
            <div class="invalid-feedback">
              Enter a valid email.
            </div>
          </div>

          <!-- Message -->
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" minlength="20" required></textarea>
            <div class="invalid-feedback">
              Message must be at least 20 characters long.
            </div>
          </div>

          <button class="btn btn-custom w-100" type="submit">
            Submit
          </button>

        </form>

      </div>

    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Validation -->
<script>
(() => {
  'use strict'

  const forms = document.querySelectorAll('.needs-validation')

  forms.forEach(form => {
    form.addEventListener('submit', event => {

      if (!form.checkValidity()) {
        event.preventDefault()
        event.stopPropagation()
      }

      form.classList.add('was-validated')
    })
  })
})()
</script>

</body>
</html>
